name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - name: Check Go module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go test ./...
