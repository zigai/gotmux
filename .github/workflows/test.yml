name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"
          cache: true
      - name: Check Go module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go test ./...
