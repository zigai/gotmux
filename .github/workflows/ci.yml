name: tmux library checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_gate:
        description: Require all v1 acceptance evidence (expected to fail for the alpha)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: go mod tidy
      - run: go test ./...
        env: {GOWORK: 'off'}
      - run: go test -race ./...
        env: {GOWORK: 'off'}
      - run: go vet ./...
      - run: go build ./...
        env: {CGO_ENABLED: '0', GOWORK: 'off'}
      - run: python3 internal/schema/generate.py --check
      - run: python3 scripts/check_ledger.py
      - run: python3 scripts/test_consumer.py
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tmux: ['3.6', '3.6a', '3.6b', '3.7c']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libevent-dev libncurses-dev
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install libevent ncurses pkg-config
      - name: Build exact tmux release
        shell: bash
        env:
          TMUX_RELEASE: ${{ matrix.tmux }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/tmux/tmux/releases/download/${TMUX_RELEASE}/tmux-${TMUX_RELEASE}.tar.gz" -o "$RUNNER_TEMP/tmux.tar.gz"
          tar -xzf "$RUNNER_TEMP/tmux.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tmux-${TMUX_RELEASE}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export PKG_CONFIG_PATH="$(brew --prefix libevent)/lib/pkgconfig:$(brew --prefix ncurses)/lib/pkgconfig"
          fi
          ./configure --prefix="$RUNNER_TEMP/tmux-install"
          make -j2
          make install
          echo "TMUX_TEST_BINARY=$RUNNER_TEMP/tmux-install/bin/tmux" >> "$GITHUB_ENV"
          test "$("$RUNNER_TEMP/tmux-install/bin/tmux" -V)" = "tmux ${TMUX_RELEASE}"
      - run: go mod tidy
      - name: Real server contracts and race checks (missing tmux cannot skip)
        run: go test -race -tags=integration -count=1 -timeout=5m ./...
        env: {TMUX_INTEGRATION_REQUIRED: '1', GOWORK: 'off'}
      - name: Retain release and command inventory
        shell: bash
        run: |
          set -euo pipefail
          socket_dir=$(mktemp -d /tmp/tg-ci-XXXXXX)
          trap '"$TMUX_TEST_BINARY" -N -S "$socket_dir/s" kill-server || true; rm -rf "$socket_dir"' EXIT
          "$TMUX_TEST_BINARY" -S "$socket_dir/s" -f /dev/null new-session -d -s inventory
          mkdir -p inventory
          python3 scripts/inventory_tmux.py --binary "$TMUX_TEST_BINARY" --socket "$socket_dir/s" --output "inventory/list-commands-${{ matrix.tmux }}-${{ runner.os }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-${{ matrix.tmux }}-${{ runner.os }}
          path: inventory/
  release-prerequisites:
    if: github.event_name == 'workflow_dispatch' && inputs.release_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_release.py
